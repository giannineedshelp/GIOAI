<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIOAI — Autocompleter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-card">
                <div class="logo-top">GIOAI</div>
                <div class="version-badge">v4.0</div>
                <h1>Autocompleter</h1>
                <p class="subtitle">Select a platform and log in</p>

                <div class="field">
                    <label>Platform</label>
                    <select id="platformSelect">
                        <option value="languagenut">🌍 LanguageNut</option>
                    </select>
                </div>

                <div class="field">
                    <label>Username</label>
                    <input type="text" id="usernameInput" placeholder="Enter your username" spellcheck="false">
                </div>

                <div class="field">
                    <label>Password</label>
                    <input type="password" id="passwordInput" placeholder="Enter your password">
                </div>

                <button id="loginBtn" class="btn primary">Log In</button>
                <p class="footer-note" id="loginStatus">Authorized pentest — credentials stay local</p>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashScreen" class="screen">
            <header class="topbar">
                <div class="topbar-left">
                    <span class="topbar-title" id="dashTitle">🌍 LanguageNut</span>
                    <span class="topbar-badge on" id="dashStatus">Connected</span>
                </div>
                <div class="topbar-right">
                    <span class="speed-label" id="dashSpeed">⏱ 2h 46m</span>
                    <button class="btn icon-btn" id="settingsBtn" title="Settings">⚙️</button>
                    <button class="btn icon-btn" id="logoutBtn" title="Logout">✕</button>
                </div>
            </header>

            <div class="dash-layout">
                <!-- Activity Log (left) -->
                <aside class="log-panel">
                    <div class="panel-title">LOG</div>
                    <div class="log-box" id="logBox">
                        <div class="log-muted">Ready</div>
                    </div>
                </aside>

                <!-- Main Content (right) -->
                <main class="main-panel">
                    <div class="toolbar">
                        <div>
                            <h2 id="taskHeader">Assignments</h2>
                            <p class="dim" id="taskCount">Loading...</p>
                        </div>
                        <div class="toolbar-actions">
                            <label class="check-all">
                                <input type="checkbox" id="selectAllCb">
                                <span>All</span>
                            </label>
                            <button class="btn primary sm" id="farmBtn">▶ Run Selected</button>
                        </div>
                    </div>

                    <!-- Progress -->
                    <div class="progress-row">
                        <div class="progress-track">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="progress-text" id="progressText">0%</span>
                    </div>

                    <!-- Task List -->
                    <div id="taskList" class="task-list"></div>
                </main>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <dialog id="settingsModal" class="modal">
        <div class="modal-inner">
            <h3>⚙️ Settings</h3>
            <div class="field">
                <label>Completion Speed (per question)</label>
                <div class="slider-row">
                    <input type="range" id="speedSlider" min="1" max="5" step="0.1" value="4.0">
                    <span id="speedLabel">2h 46m 40s</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn outline sm" onclick="setAllChecks(true)">✓ All</button>
                <button class="btn outline sm" onclick="setAllChecks(false)">✕ None</button>
                <button class="btn primary sm" onclick="document.getElementById('settingsModal').close()">Done</button>
            </div>
        </div>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
